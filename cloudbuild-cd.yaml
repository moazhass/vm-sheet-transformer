# cloudbuild-cd.yaml — runs on every push/merge to main.
#
# 1. Backend tests (pytest) + frontend type-check (tsc)
# 2. Build multi-stage container image
# 3. Push immutable SHA tags to Artifact Registry
# 4. Create a Cloud Deploy release → auto-deploys to staging,
#    holds at production for manual approval.

substitutions:
  _PROJECT: moaz-moazplayground
  _REGION: me-central2
  _AR_REPO: vm-sheet-transformer
  _IMAGE_NAME: vm-sheet-transformer
  _DELIVERY_PIPELINE: vm-sheet-transformer-pipeline

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamic_substitutions: true

serviceAccount: projects/moaz-moazplayground/serviceAccounts/cb-cicd-sa@moaz-moazplayground.iam.gserviceaccount.com

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}-${BUILD_ID}"

steps:
  - id: backend-test
    name: python:3.12-slim
    entrypoint: bash
    waitFor: ['-']
    args:
      - -c
      - |
        set -euo pipefail
        cd backend
        pip install --quiet -r requirements.txt
        python -m pytest tests/ -v --maxfail=3

  - id: frontend-test
    name: node:20-alpine
    entrypoint: sh
    waitFor: ['-']
    args:
      - -c
      - |
        set -eu
        cd frontend
        # TODO: generate package-lock.json and switch to `npm ci` for
        # reproducible installs.
        npm install --no-audit --no-fund
        npx tsc --noEmit

  - id: docker-build
    name: gcr.io/cloud-builders/docker
    waitFor: ['backend-test', 'frontend-test']
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}-${BUILD_ID}
      - --label=git-commit=${COMMIT_SHA}
      - --label=git-branch=${BRANCH_NAME}
      - --label=build-id=${BUILD_ID}
      - .

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    waitFor: ['docker-build']
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}
        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}-${BUILD_ID}

  - id: clouddeploy-release
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: ['docker-push']
    entrypoint: gcloud
    args:
      - deploy
      - releases
      - create
      - release-${SHORT_SHA}-${BUILD_ID}
      - --project=${_PROJECT}
      - --region=${_REGION}
      - --delivery-pipeline=${_DELIVERY_PIPELINE}
      - --source=.
      - --images=vm-sheet-transformer=${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}
      - --description=Commit ${SHORT_SHA} on ${BRANCH_NAME}
