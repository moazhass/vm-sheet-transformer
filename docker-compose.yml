services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vm-sheet-transformer:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ALLOWED_EMAIL_DOMAINS: "devoteam.com,devoteam.sa"
      MAX_UPLOAD_MB: "25"
      ENABLE_GCS_STORAGE: "false"
      DEV_AUTH_BYPASS: "true"
      SESSION_SECRET: "local-dev-secret-change-me"
      LOG_LEVEL: "INFO"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
