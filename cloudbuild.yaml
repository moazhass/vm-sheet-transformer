substitutions:
  _REGION: me-central2
  _REPOSITORY: vm-sheet-transformer
  _SERVICE_NAME: vm-sheet-transformer
  _SERVICE_ACCOUNT: vm-sheet-transformer@${PROJECT_ID}.iam.gserviceaccount.com
  _ALLOWED_DOMAINS: devoteam.com,devoteam.sa
  _MAX_UPLOAD_MB: "25"
  _ENABLE_GCS: "false"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}"
      - --tag
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:latest"
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}"

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_SERVICE_ACCOUNT}
      - --no-allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --concurrency=20
      - --max-instances=5
      - --timeout=300
      - --set-env-vars=ALLOWED_EMAIL_DOMAINS=${_ALLOWED_DOMAINS},MAX_UPLOAD_MB=${_MAX_UPLOAD_MB},ENABLE_GCS_STORAGE=${_ENABLE_GCS},DEV_AUTH_BYPASS=false
      # OAuth credentials and SESSION_SECRET should be wired from Secret Manager:
      - --set-secrets=SESSION_SECRET=vmt-session-secret:latest,GOOGLE_CLIENT_ID=vmt-google-client-id:latest,GOOGLE_CLIENT_SECRET=vmt-google-client-secret:latest,OAUTH_REDIRECT_URL=vmt-oauth-redirect-url:latest
