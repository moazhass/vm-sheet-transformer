# Production Cloud Run service. Mirrors the live service that already exists
# (vm-sheet-transformer in moaz-moazplayground). Cloud Deploy will apply this
# manifest after manual approval.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: vm-sheet-transformer
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: vm-sheet-transformer@moaz-moazplayground.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: vm-sheet-transformer
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: ENVIRONMENT
              value: production
            - name: DEV_AUTH_BYPASS
              value: "false"
            - name: ALLOWED_EMAIL_DOMAINS
              value: devoteam.com
            - name: MAX_UPLOAD_MB
              value: "25"
            - name: ENABLE_GCS_STORAGE
              value: "false"
            - name: LOG_LEVEL
              value: INFO
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vmt-session-secret
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vmt-google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vmt-google-client-secret
            - name: OAUTH_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: vmt-oauth-redirect-url
          startupProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 30
            timeoutSeconds: 5
  traffic:
    - percent: 100
      latestRevision: true
